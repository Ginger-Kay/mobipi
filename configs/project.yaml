project_root: /share/jhk/MobiWAM
python_env: /share/jhk/MobiWAM/env
research_repo: /share/jhk/MobiWAM/control
engineering_repo: /share/jhk/MobiWAM/Mobipi
artifact_root: /share/jhk/MobiWAM/artifacts/MMWAM-OBC-001
vanilla_rollout_command: PYTHONNOUSERSITE=1 CUDA_VISIBLE_DEVICES=<selected> /share/jhk/MobiWAM/env/bin/python scripts/run_checkpoint_vanilla.py --config configs/mobipi_close_single_door.json --output-root <run-root>

gpu_policy:
  launch_policy: autonomous_select
  monitor_seconds_minimum: 10
  allow_colocation_when_memory_sufficient: true
  unknown_process_control: forbidden
  lease_or_preemption_wrapper: forbidden

dependency_roles:
  primary_rollout_stack: Mobi-pi / existing RoboCasa integration
  primary_rollout_version: robocasa==0.2.0 upstream 3683fb01 with compatibility commit 426bc4db
  held_out_transfer_stack: RoboCasa365 v1.0.1 deferred until compatible with the sole sprint environment
  trajectory_baseline: DreamTrajectory-style evaluator; it does not implement route A
  online_assistance_reference: kinematic feasibility / reactive whole-body control
  learned_route_evaluator: MobiWAM structured option-boundary consequences
  optional_auxiliary_representations:
    - video future
    - 4D-WAM
    - DECOWAM-style base-arm factorization

storage_policy:
  project_peak_limit_gib: null
  limit_override: researcher_removed_2026-08-31
  capacity_guard: monitor_available_space_and_never_fill_shared_filesystem
  allow_duplicate_checkpoints: false
  allow_duplicate_datasets: false

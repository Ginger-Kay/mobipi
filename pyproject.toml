[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobiwam-gate0"
version = "0.1.0"
description = "Gate 0 contracts and paired route-oracle analysis for MobiWAM"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
mobiwam-collect = "mobiwam.collection:main"
mobiwam-dataset = "mobiwam.dataset:main"
mobiwam-oracle = "mobiwam.oracle:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobipi"
version = "0.1.0"
description = "Typed paired-route collection, matched evaluators, and OBC-WAM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy==1.23.3", "torch==2.2.0", "PyYAML>=6.0"]

[project.scripts]
mobiwam-collect = "mobiwam.collection:main"
mobiwam-dataset = "mobiwam.dataset:main"
mobiwam-oracle = "mobiwam.oracle:main"
mobiwam-train = "mobiwam.training:main"
mobiwam-calibrate = "mobiwam.calibration:main"
mobiwam-evaluate = "mobiwam.evaluate_cli:main"
mobiwam-latency = "mobiwam.latency:main"
mobiwam-bind-config = "mobiwam.run_config:main"
mobiwam-extract-features = "mobiwam.extract_features:main"
mobiwam-predict = "mobiwam.predict:main"

[tool.setuptools]
packages = ["mobipi", "mobiwam", "mobiwam.adapters"]
package-dir = {mobipi = "mobipi", mobiwam = "src/mobiwam"}
